{% extends 'admin/base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto" 
     x-data="{ 
        viewOpen: false, 
        activeOrder: {},
        statusColors: {
            'Processing': 'bg-yellow-500/10 text-yellow-500 border-yellow-500/20',
            'Shipped': 'bg-blue-500/10 text-blue-400 border-blue-500/20',
            'Delivered': 'bg-green-500/10 text-green-400 border-green-500/20',
            'Cancelled': 'bg-red-500/10 text-red-400 border-red-500/20'
        }
     }">
    
    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div>
            <h1 class="font-heading text-3xl font-bold text-white">Fulfillment Center</h1>
            <p id="admin-orders-count" class="text-slate-500 text-sm mt-1">
                {% include 'admin/partials/order_count.html' %}
            </p>
        </div>
        
        <form action="{{ url_for('admin.admin_orders') }}" method="get" class="relative w-full md:w-auto">
            <input type="text" 
                   name="q" 
                   value="{{ q }}"
                   hx-get="{{ url_for('admin.admin_orders') }}"
                   hx-trigger="keyup changed delay:500ms, search"
                   hx-target="#admin-orders-panel"
                   hx-swap="outerHTML"
                   hx-push-url="true"
                   placeholder="Search ID, Name, Email..." 
                   class="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg pl-10 pr-4 py-2 focus:border-cyan-500 focus:outline-none w-full md:w-72">
            <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </form>
    </div>

    <div x-show="viewOpen" 
         class="fixed inset-y-0 right-0 w-[450px] bg-slate-900 border-l border-slate-700 shadow-2xl transform transition-transform duration-300 z-50 overflow-y-auto"
         x-transition:enter="translate-x-full"
         x-transition:enter-start="translate-x-full"
         x-transition:enter-end="translate-x-0"
         x-transition:leave="translate-x-0"
         x-transition:leave-start="translate-x-0"
         x-transition:leave-end="translate-x-full"
         x-cloak>
         
         <div class="p-6 border-b border-slate-800 flex justify-between items-start bg-slate-900/95 sticky top-0 backdrop-blur z-10">
             <div>
                 <h3 class="font-bold text-xl text-white">Order <span class="text-cyan-400 font-mono">#<span x-text="activeOrder.id"></span></span></h3>
                 <p class="text-xs text-slate-500 mt-1" x-text="activeOrder.created_at"></p>
             </div>
             <button @click="viewOpen = false" class="text-slate-500 hover:text-white transition bg-slate-800 p-1 rounded-full">
                 <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
             </button>
         </div>

         <div class="p-6 space-y-8">
             
             <div class="bg-slate-800/50 rounded-lg p-4 border border-slate-800">
                 <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Customer Details</h4>
                 <div class="flex items-center gap-3 mb-3">
                     <div class="w-10 h-10 rounded-full bg-cyan-900/30 text-cyan-400 flex items-center justify-center font-bold border border-cyan-500/20">
                         <span x-text="activeOrder.customer_name ? activeOrder.customer_name[0] : '?'"></span>
                     </div>
                     <div>
                         <div class="text-white font-bold" x-text="activeOrder.customer_name"></div>
                         <div class="text-xs text-slate-400" x-text="activeOrder.customer_email"></div>
                     </div>
                 </div>
                 <div class="text-xs text-slate-400 border-t border-slate-700/50 pt-3 mt-3">
                     <span class="block font-bold text-slate-500 mb-1">Shipping Address:</span>
                     <div x-text="activeOrder.shipping_address"></div>
                     <div x-text="activeOrder.city + ', ' + activeOrder.zip_code"></div>
                 </div>
             </div>

             <div>
                 <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 flex justify-between">
                     <span>Packing List</span>
                     <span class="text-white font-mono"
                           x-text="'$' + Number(activeOrder.total_amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })"></span>
                 </h4>
                 
                 <div class="space-y-3">
                     <template x-for="item in activeOrder.items" :key="item.product_id">
                         <div class="flex gap-3 bg-slate-800 p-3 rounded-lg border border-slate-700">
                             <div class="w-12 h-12 rounded bg-slate-900 overflow-hidden shrink-0 border border-slate-600">
                                 <img :src="item.image" class="w-full h-full object-cover">
                             </div>
                             <div class="flex-1 min-w-0">
                                 <div class="flex justify-between items-start">
                                     <span class="text-white text-sm font-bold truncate pr-2" x-text="item.name"></span>
                                     <span class="text-cyan-400 font-mono text-xs" x-text="'x' + item.quantity"></span>
                                 </div>
                                 
                                 <div class="flex flex-wrap gap-1 mt-1.5">
                                     <template x-for="(val, key) in item.specs" :key="key">
                                         <span class="text-[10px] bg-slate-900 border border-slate-700 text-slate-400 px-1.5 rounded uppercase flex items-center gap-1">
                                             <span class="opacity-70" x-text="key + ':'"></span>
                                             <span class="text-slate-300" x-text="val"></span>
                                         </span>
                                     </template>
                                 </div>
                             </div>
                         </div>
                     </template>
                 </div>
             </div>
         </div>
         
         <div class="p-6 border-t border-slate-800 bg-slate-900/95 sticky bottom-0 backdrop-blur">
             <button @click="viewOpen = false" class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-black font-bold rounded-lg transition">
                 Close Panel
             </button>
         </div>
    </div>

    {% set oob = false %}
    {% include 'admin/partials/orders_panel.html' %}
</div>
{% endblock %}
